<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101010" />
    <title>Cek Status Booking | Enmax House</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
      :root {
        --bg: #101010;
        --panel: #191919;
        --border: #303030;
        --pink: #ff2aa6;
        --muted: #999;
        --white: #f5f5f5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 24px 16px;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--white);
        font-family: Arial, sans-serif;
      }

      .container {
        width: 100%;
        max-width: 480px;
      }

      .brand {
        text-align: center;
        margin-bottom: 28px;
      }

      .brand h1 {
        margin: 0;
        font-size: 25px;
        letter-spacing: 3px;
      }

      .brand span {
        color: var(--pink);
      }

      .brand p {
        color: var(--muted);
        font-size: 13px;
        margin-top: 9px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 25px;
      }

      h2 {
        margin: 0 0 8px;
        font-size: 20px;
      }

      .description {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
        margin: 0 0 22px;
      }

      label {
        display: block;
        font-size: 13px;
        margin-bottom: 9px;
      }

      input {
        width: 100%;
        padding: 15px;
        background: #101010;
        border: 1px solid var(--border);
        border-radius: 9px;
        color: white;
        font-size: 15px;
        outline: none;
        text-transform: uppercase;
      }

      input:focus {
        border-color: var(--pink);
      }

      button {
        width: 100%;
        margin-top: 13px;
        padding: 15px;
        border: 0;
        border-radius: 9px;
        background: var(--pink);
        color: white;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      .message {
        display: none;
        margin-top: 16px;
        padding: 12px;
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.5;
      }

      .message.error {
        display: block;
        color: #ffaaaa;
        background: #351c1c;
      }

      .result {
        display: none;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
      }

      .result-code {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 13px;
      }

      .status {
        display: inline-block;
        padding: 8px 13px;
        border-radius: 30px;
        font-size: 12px;
        font-weight: bold;
        margin-bottom: 12px;
        background: #383024;
        color: #ffc36b;
      }

      .status.confirmed {
        background: #173626;
        color: #71e5a0;
      }

      .status.rejected {
        background: #3b2020;
        color: #ff8585;
      }

      .status.returned {
        background: #252d42;
        color: #a9c3ff;
      }

      .status-title {
        font-size: 18px;
        font-weight: bold;
        margin: 0 0 8px;
      }

      .status-description {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
        margin-bottom: 20px;
      }

      .details {
        display: grid;
        gap: 14px;
      }

      .detail {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        font-size: 13px;
      }

      .detail span:first-child {
        color: var(--muted);
      }
      .detail span:last-child {
        text-align: right;
        overflow-wrap: anywhere;
      }

      .back {
        display: block;
        text-align: center;
        color: var(--muted);
        text-decoration: none;
        font-size: 13px;
        margin-top: 22px;
      }

      .back:hover {
        color: var(--pink);
      }

      @media (max-width: 400px) {
        .panel {
          padding: 20px;
        }
        .detail {
          font-size: 12px;
        }
      }
    </style>
  </head>

  <body>
    <main class="container">
      <div class="brand">
        <h1>ENMAX <span>HOUSE</span></h1>
        <p>Camera Rental Service</p>
      </div>

      <section class="panel">
        <h2>Cek Status Booking</h2>
        <p class="description">
          Masukkan kode booking yang kamu dapatkan setelah mengirim formulir
          pemesanan untuk melihat status pesananmu.
        </p>

        <form id="checkForm">
          <label for="bookingCode">Kode Booking</label>
          <input
            id="bookingCode"
            type="text"
            placeholder="Contoh: ENMAX-8F29A1B2C3"
            autocomplete="off"
            required
          />
          <button id="checkBtn" type="submit">Cek Status</button>
        </form>

        <div id="message" class="message"></div>

        <div id="result" class="result">
          <div class="result-code" id="resultCode"></div>
          <div id="statusBadge" class="status"></div>
          <h3 id="statusTitle" class="status-title"></h3>
          <p id="statusDescription" class="status-description"></p>

          <div class="details">
            <div class="detail">
              <span>Nama</span>
              <span id="customerName">-</span>
            </div>
            <div class="detail">
              <span>Kamera</span>
              <span id="cameraName">-</span>
            </div>
            <div class="detail">
              <span>Jumlah</span>
              <span id="quantity">-</span>
            </div>
            <div class="detail">
              <span>Pickup</span>
              <span id="pickupAt">-</span>
            </div>
            <div class="detail">
              <span>Pengembalian</span>
              <span id="returnAt">-</span>
            </div>
          </div>
        </div>
      </section>

      <a class="back" href="index.html">← Kembali ke Enmax House</a>
    </main>

    <script>
      const SUPABASE_URL = "https://egfuemmimojqzdqjsofg.supabase.co";
      const SUPABASE_KEY = "sb_publishable_TWiZEW8hb8rI91I4cu3Law_H9NCykz6";

      const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      const form = document.getElementById("checkForm");
      const input = document.getElementById("bookingCode");
      const button = document.getElementById("checkBtn");
      const message = document.getElementById("message");
      const result = document.getElementById("result");

      function formatDate(value) {
        if (!value) return "-";

        return (
          new Date(value).toLocaleString("id-ID", {
            timeZone: "Asia/Makassar",
            day: "2-digit",
            month: "long",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
          }) + " WITA"
        );
      }

      function showMessage(text) {
        message.textContent = text;
        message.className = "message error";
      }

      function hideMessage() {
        message.textContent = "";
        message.className = "message";
      }

      function displayBooking(booking) {
        const status = (booking.status || "pending").toLowerCase();

        const statusInfo = {
          pending: {
            label: "PENDING",
            title: "Menunggu Konfirmasi Admin",
            description:
              "Booking kamu sudah masuk ke sistem. Admin sedang memeriksa pesanan dan ketersediaan kamera.",
            className: "",
          },
          confirmed: {
            label: "DITERIMA",
            title: "Booking Berhasil Dikonfirmasi!",
            description:
              "Booking kamu sudah disetujui oleh admin Enmax House. Silakan hubungi admin jika membutuhkan informasi lebih lanjut.",
            className: "confirmed",
          },
          rejected: {
            label: "DITOLAK",
            title: "Booking Belum Dapat Disetujui",
            description:
              "Mohon maaf, booking kamu belum dapat disetujui. Silakan hubungi admin Enmax House untuk informasi lebih lanjut.",
            className: "rejected",
          },
          returned: {
            label: "SELESAI",
            title: "Rental Telah Selesai",
            description: "Terima kasih telah menggunakan layanan Enmax House!",
            className: "returned",
          },
        };

        const info = statusInfo[status] || {
          label: status.toUpperCase(),
          title: "Status Booking Diperbarui",
          description: "Silakan hubungi admin untuk informasi lebih lanjut.",
          className: "",
        };

        document.getElementById("resultCode").textContent =
          "KODE BOOKING: " + booking.booking_code;

        const badge = document.getElementById("statusBadge");
        badge.textContent = info.label;
        badge.className = "status " + info.className;

        document.getElementById("statusTitle").textContent = info.title;
        document.getElementById("statusDescription").textContent =
          info.description;

        document.getElementById("customerName").textContent =
          booking.customer_name || "-";
        document.getElementById("cameraName").textContent =
          booking.camera_name || "-";
        document.getElementById("quantity").textContent =
          (booking.quantity ?? "-") + (booking.quantity ? " unit" : "");
        document.getElementById("pickupAt").textContent = formatDate(
          booking.pickup_at,
        );
        document.getElementById("returnAt").textContent = formatDate(
          booking.return_at,
        );

        result.style.display = "block";
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const code = input.value.trim().toUpperCase();

        if (!code) return;

        button.disabled = true;
        button.textContent = "Memeriksa...";
        result.style.display = "none";
        hideMessage();

        try {
          const { data, error } = await db.rpc("get_booking_status", {
            p_booking_code: code,
          });

          if (error) throw error;

          if (!data || data.length === 0) {
            showMessage(
              "Kode booking tidak ditemukan. Periksa kembali kode yang kamu masukkan.",
            );
            return;
          }

          displayBooking(data[0]);
        } catch (error) {
          console.error("Booking status error:", error);
          showMessage(
            "Terjadi kendala saat memeriksa booking. Silakan coba lagi beberapa saat.",
          );
        } finally {
          button.disabled = false;
          button.textContent = "Cek Status";
        }
      });

      input.addEventListener("input", () => {
        input.value = input.value.toUpperCase();
      });
    </script>
  </body>
</html>
